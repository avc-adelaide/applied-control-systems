name: Compile Worked Examples
# This workflow compiles worked examples and deploys them to GitHub Pages
# The conflicting jekyll-gh-pages.yml workflow has been disabled to prevent overwriting this deployment

on:
  push:
    branches: ["main"]
    paths:
      - 'worked-examples/**'
      - 'worked-examples-template.sty'
      - 'beamer-control-maths.sty'
      - '.github/workflows/compile-examples.yml'
      - '.github/scripts/compile-examples.sh'
      - '.github/scripts/generate-index.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  compile-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-extra texlive-science

      - name: Compile worked examples
        run: ./.github/scripts/compile-examples.sh _site

      - name: Generate index page
        run: ./.github/scripts/generate-index.sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
