name: Compile Worked Examples and Deploy with Jekyll

on:
  push:
    branches: ["main"]
    paths:
      - 'worked-examples/**'
      - 'worked-examples-template.sty'
      - 'beamer-control-maths.sty'
      - '.github/workflows/compile-examples.yml'
      - '.github/scripts/compile-examples.sh'
      - 'index.md'
      - '_config.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-extra texlive-science

      - name: Compile worked examples
        run: ./.github/scripts/compile-examples.sh .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
